# 姿态保护控制器 · 决策表审计
# 可配置宿主机端口：HOST_PORT=9090 docker compose up --build
services:
  app:
    build: .
    image: attitude-guard-audit:latest
    environment:
      PORT: "8080"
    ports:
      - "${HOST_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 5

  # 一次性验收服务：等待 app 健康后执行全部边界核对，完成即退出，
  # 退出码即本次验收结果（0 通过 / 非 0 失败）。
  verify:
    build: .
    image: attitude-guard-audit:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: "http://app:8080"
    entrypoint: ["node", "src/verify.js"]
    restart: "no"
